<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tune Timeline — Interactieve Mockups (TV 16:9 &amp; Telefoon)</title>
<style>
  :root {
    /* Midnight Vinyl & Amber Brass — exact uit Hoofdstuk 4 */
    --bg: #0D1117;
    --surface: #161C27;
    --elevated: #1F2736;
    --groove: #2D3748;
    --ivory: #F7F3E9;
    --mist: #A8B3C5;
    --amber: #F5A623;
    --amber-soft: rgba(245, 166, 35, 0.16);
    --emerald: #22C57E;
    --emerald-soft: rgba(34, 197, 126, 0.16);
    --coral: #EF476F;
    --coral-soft: rgba(239, 71, 111, 0.18);
    --cobalt: #3B82F6;

    /* Decennium-kleurcodes */
    --d-60: #C96A4B;
    --d-70: #D99B26;
    --d-80: #E04F6D;
    --d-90: #1EA896;
    --d-00: #3B82F6;
    --d-10: #8B5CF6;
    --d-20: #10B981;

    --font-display: "SF Pro Display", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body: "SF Pro Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #070A0F;
    color: var(--ivory);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .num { font-variant-numeric: tabular-nums; }

  /* ==================== STUDIO CHROME (SHOWCASE WRAPPER) ==================== */
  .studio-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13, 17, 23, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .studio-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .studio-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .studio-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    background: var(--amber-soft);
    border: 1px solid rgba(245, 166, 35, 0.35);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .studio-view-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--groove);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }

  .view-btn {
    background: transparent;
    border: none;
    color: var(--mist);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .view-btn:hover { color: var(--ivory); }
  .view-btn.active {
    background: var(--amber);
    color: #0D1117;
  }

  .state-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .state-btn {
    background: var(--surface);
    border: 1px solid rgba(255, 255, 255, 0.09);
    color: var(--mist);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .state-btn:hover {
    border-color: rgba(245, 166, 35, 0.45);
    color: var(--ivory);
  }
  .state-btn.active {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: var(--ivory);
  }
  .state-btn .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    font-size: 11px;
    font-weight: 700;
    color: var(--mist);
  }
  .state-btn.active .step-num {
    background: var(--amber);
    color: #0D1117;
  }

  .state-caption {
    background: rgba(22, 28, 39, 0.72);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding: 9px 20px;
    font-size: 13.5px;
    color: var(--mist);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .state-caption strong { color: var(--ivory); }

  /* ==================== STAGE (SIDE BY SIDE) ==================== */
  .stage {
    padding: 20px 24px 28px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 24px;
    flex-wrap: nowrap;
  }
  @media (max-width: 920px) {
    .stage { flex-wrap: wrap; }
  }

  .device-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .device-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--mist);
    padding: 0 4px;
  }
  .device-label span.pill {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--amber);
    background: rgba(245, 166, 35, 0.12);
    padding: 2px 8px;
    border-radius: 999px;
  }

  /* TV Shell with exact 1920x1080 internal coordinate system */
  .tv-bezel {
    background: #05070B;
    border: 2px solid #263042;
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
    overflow: hidden;
  }

  .tv-viewport {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    background: var(--bg);
    width: var(--tv-w, 1024px);
    height: var(--tv-h, 576px);
  }

  .tv-canvas {
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
    transform: scale(var(--tv-scale, 0.533333));
    background:
      radial-gradient(ellipse 900px 560px at 50% 42%, rgba(245, 166, 35, 0.075), transparent 70%),
      radial-gradient(ellipse 680px 440px at 85% 90%, rgba(59, 130, 246, 0.06), transparent 70%),
      var(--bg);
    color: var(--ivory);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    user-select: none;
  }

  /* Phone Shell with exact 390x844 internal coordinate system */
  .phone-bezel {
    background: #06080D;
    border: 3px solid #2C3649;
    border-radius: 44px;
    padding: 12px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
    position: relative;
  }
  .phone-notch {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 68px;
    height: 4px;
    background: #263042;
    border-radius: 999px;
    z-index: 20;
    pointer-events: none;
  }

  .phone-viewport {
    position: relative;
    overflow: hidden;
    border-radius: 34px;
    background: var(--bg);
    width: var(--ph-w, 312px);
    height: var(--ph-h, 675.2px);
  }

  .phone-canvas {
    width: 390px;
    height: 844px;
    transform-origin: top left;
    transform: scale(var(--ph-scale, 0.8));
    background:
      radial-gradient(circle 340px at 50% 0%, rgba(245, 166, 35, 0.08), transparent 65%),
      var(--bg);
    color: var(--ivory);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Fullscreen View Modes */
  body.mode-tv .phone-wrap { display: none; }
  body.mode-phone .tv-wrap { display: none; }

  body.chrome-hidden .studio-bar,
  body.chrome-hidden .state-caption,
  body.chrome-hidden .device-label { display: none; }
  body.chrome-hidden .stage { padding: 0; gap: 0; }
  body.chrome-hidden .tv-bezel,
  body.chrome-hidden .phone-bezel {
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    background: var(--bg);
  }
  body.chrome-hidden .tv-viewport,
  body.chrome-hidden .phone-viewport { border-radius: 0; }
  body.chrome-hidden .phone-notch { display: none; }

  /* Floating exit button when viewing fullscreen manually (not capture) */
  .exit-fs-btn {
    display: none;
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 999;
    background: rgba(13, 17, 23, 0.85);
    color: var(--ivory);
    border: 1px solid rgba(245, 166, 35, 0.6);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  body.show-exit-fs .exit-fs-btn { display: inline-flex; }

  /* ==================== SHARED LOGO & ICONS ==================== */
  .logo-lockup {
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .logo-text {
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: 0.04em;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .logo-text .t1 { color: var(--ivory); }
  .logo-text .t2 { color: var(--amber); font-weight: 600; letter-spacing: 0.1em; }

  .token-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: radial-gradient(circle at 35% 30%, #FFD57A, #F5A623 65%, #C97A0A);
    color: #0D1117;
    font-size: 11px;
    font-weight: 900;
    box-shadow: 0 0 10px rgba(245, 166, 35, 0.45);
    flex-shrink: 0;
  }

  /* ==================== TV 1920x1080 LAYOUT SYSTEM ==================== */
  .tv-top-rail {
    height: 114px;
    padding: 14px 28px 10px;
    display: flex;
    align-items: stretch;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(13, 17, 23, 0.8);
    flex-shrink: 0;
  }

  .tv-player-pill {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 2px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: all 0.25s ease;
  }
  .tv-player-pill.active {
    background: #1D2535;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.22), 0 12px 26px rgba(0, 0, 0, 0.4);
  }
  .tv-player-pill.matchpoint {
    border-color: rgba(239, 71, 111, 0.72);
    box-shadow: 0 0 18px rgba(239, 71, 111, 0.24);
  }
  .tv-player-pill.offline { opacity: 0.52; }

  .tv-pill-row1 {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .p-avatar {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    color: #0D1117;
    flex-shrink: 0;
  }
  .p-name {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 700;
    color: var(--ivory);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tv-top-rail.rail-10 .p-name { font-size: 18px; }
  .tv-top-rail.rail-10 .tv-player-pill { padding: 9px 11px 11px; }
  .tv-top-rail.rail-10 .p-avatar { width: 24px; height: 24px; font-size: 12px; border-radius: 7px; }

  .tv-pill-row2 {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-top: 2px;
  }
  .p-score {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    color: var(--ivory);
    line-height: 1;
  }
  .p-score span { font-size: 16px; font-weight: 600; color: var(--mist); }
  .tv-top-rail.rail-10 .p-score { font-size: 23px; }

  .p-tokens {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 18px;
    font-weight: 700;
    color: var(--amber);
  }
  .p-tokens .token-dot { width: 17px; height: 17px; font-size: 10px; }

  .p-progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5px;
    background: rgba(255, 255, 255, 0.06);
  }
  .p-progress-fill { height: 100%; border-radius: 0 3px 3px 0; }

  .match-tag {
    position: absolute;
    top: 7px;
    right: 8px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    background: var(--coral);
    color: var(--ivory);
    padding: 2px 6px;
    border-radius: 5px;
  }

  /* TV Main Stage */
  .tv-main {
    flex: 1;
    padding: 28px 44px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    min-height: 0;
  }

  /* TV Bottom Bar */
  .tv-bottom {
    height: 86px;
    padding: 0 36px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(13, 17, 23, 0.88);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-shrink: 0;
  }

  .tv-bottom-left {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 20px;
    color: var(--mist);
    font-weight: 600;
  }
  .tv-bottom-left strong { color: var(--ivory); }

  .tv-reactions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .reaction-bubble {
    background: var(--elevated);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 18px;
    font-weight: 600;
    color: var(--ivory);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .tv-bottom-qr {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mini-qr-box {
    width: 56px;
    height: 56px;
    background: #FFFFFF;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .room-chip {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .room-chip .lbl { font-size: 13px; color: var(--mist); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .room-chip .code { font-family: var(--font-mono); font-size: 26px; font-weight: 800; color: var(--amber); letter-spacing: 0.14em; }

  /* ==================== TV COMPONENTS: HEADER / VINYL / BANNERS ==================== */
  .tv-turn-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
  }

  .vinyl-cluster {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .vinyl-disc {
    width: 126px;
    height: 126px;
    border-radius: 999px;
    background:
      radial-gradient(circle at center, #0D1117 0 11%, #F5A623 11% 29%, #161C27 29% 31%, #0B0E14 31% 100%);
    border: 2px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    position: relative;
    flex-shrink: 0;
  }
  .vinyl-disc::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 999px;
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.03), inset 0 0 0 20px rgba(255, 255, 255, 0.04);
  }
  .vinyl-disc.spinning { animation: spinVinyl 6s linear infinite; }
  @keyframes spinVinyl { to { transform: rotate(360deg); } }

  .eq-bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 5px;
    height: 26px;
    margin-left: 10px;
  }
  .eq-bars i {
    display: block;
    width: 5px;
    border-radius: 3px;
    background: var(--amber);
    animation: eqPulse 0.9s ease-in-out infinite alternate;
  }
  .eq-bars i:nth-child(1) { height: 14px; animation-delay: 0s; }
  .eq-bars i:nth-child(2) { height: 26px; animation-delay: 0.2s; }
  .eq-bars i:nth-child(3) { height: 18px; animation-delay: 0.45s; }
  .eq-bars i:nth-child(4) { height: 24px; animation-delay: 0.15s; }
  @keyframes eqPulse {
    from { transform: scaleY(0.38); }
    to { transform: scaleY(1); }
  }

  .turn-title-block .eyebrow {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .turn-title-block h1 {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 800;
    color: var(--ivory);
    line-height: 1.08;
  }
  .turn-title-block .sub {
    font-size: 22px;
    color: var(--mist);
    margin-top: 8px;
  }

  .claim-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--amber-soft);
    border: 1.5px solid var(--amber);
    color: var(--ivory);
    font-size: 20px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    margin-top: 10px;
  }

  .tv-timer-box {
    background: var(--surface);
    border: 2px solid var(--groove);
    border-radius: 20px;
    padding: 16px 28px;
    min-width: 210px;
    text-align: center;
  }
  .tv-timer-box.urgent {
    border-color: var(--coral);
    background: rgba(239, 71, 111, 0.14);
    box-shadow: 0 0 28px rgba(239, 71, 111, 0.25);
  }
  .tv-timer-box .t-lbl {
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--mist);
  }
  .tv-timer-box .t-val {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 800;
    line-height: 1.05;
    color: var(--ivory);
  }
  .tv-timer-box.urgent .t-val { color: var(--coral); }

  /* Steal Banner */
  .steal-banner {
    background: linear-gradient(90deg, rgba(239, 71, 111, 0.24), rgba(245, 166, 35, 0.18));
    border: 2px solid var(--coral);
    border-radius: 20px;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    position: relative;
    overflow: hidden;
  }
  .steal-banner h2 {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 800;
    color: var(--ivory);
  }
  .steal-banner p { font-size: 21px; color: var(--ivory); opacity: 0.9; margin-top: 4px; }
  .steal-progress-track {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 7px;
    background: rgba(255, 255, 255, 0.1);
  }
  .steal-progress-bar {
    height: 100%;
    width: 72%;
    background: linear-gradient(90deg, var(--coral), var(--amber));
  }

  /* ==================== TV HORIZONTAL TIMELINE ==================== */
  .tv-timeline-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    padding: 18px 0;
  }

  .timeline-axis-labels {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mist);
    margin-bottom: 18px;
    padding: 0 8px;
  }

  .tv-timeline-track {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 8px;
  }
  .tv-timeline-track::before {
    content: "";
    position: absolute;
    left: 24px;
    right: 24px;
    top: 50%;
    height: 4px;
    background: linear-gradient(90deg, rgba(245, 166, 35, 0.15), rgba(245, 166, 35, 0.45), rgba(245, 166, 35, 0.15));
    border-radius: 999px;
    z-index: 0;
  }

  /* Open Music Card on TV */
  .tv-card {
    position: relative;
    z-index: 2;
    width: 216px;
    height: 276px;
    background: var(--surface);
    border: 2px solid rgba(255, 255, 255, 0.11);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.48);
    flex-shrink: 0;
  }
  .tv-timeline-track.dense {
    gap: 10px;
  }
  .tv-timeline-track.dense .tv-card {
    width: 150px;
    height: 214px;
    border-radius: 15px;
  }
  .tv-timeline-track.win10 .tv-card {
    width: 158px;
    height: 206px;
    border-radius: 14px;
  }

  .tv-card-strip { height: 11px; width: 100%; }
  .tv-card-body {
    flex: 1;
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
  }
  .tv-card-decade {
    font-size: 13px;
    font-weight: 800;

  function svgQR(size = 280) {
    // Clean stylized vector QR pattern (deterministic matrix, looks crisp & real)
    const pattern = [
      "111111101011001111111",
      "100000100101101000001",
      "101110101110001011101",
      "101110100010101011101",
      "101110101001101011101",
      "100000101100001000001",
      "111111101010101111111",
      "000000001101000000000",
      "101101110011110110101",
      "010010001100101001010",
      "110111101011011101100",
      "001001010100100010011",
      "111010111011011011101",
      "000000001001101001010",
      "111111100110101010110",
      "100000101001010101001",
      "101110101110101110101",
      "101110100011010001011",
      "101110101100111010100",
      "100000100110000101110",
      "111111101011101100101"
    ];
    let rects = "";
    for (let y = 0; y < pattern.length; y++) {
      for (let x = 0; x < pattern[y].length; x++) {
        if (pattern[y][x] === "1") {
          rects += `<rect x="${x}" y="${y}" width="1" height="1" rx="0.16" fill="#0D1117"/>`;
        }
      }
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 21 21" shape-rendering="crispEdges">${rects}</svg>`;
  }

          <div class="tv-slot stolen" style="border-color:${s.color};background:${s.color}29">
            <div class="steal-chip-badge">
              <div class="steal-chip-circle" style="background:${s.color}">${s.icon}</div>
              <div class="steal-chip-name">${s.name}</div>

          </div>`;
      } else if (showSlots) {
        items += `<div class="tv-slot"><span>+</span><span class="slot-num">Plek ${i + 1}</span></div>`;
      }
      if (i < cards.length) {

      }

    return `
      <div class="tv-timeline-stage">
        <div class="timeline-axis-labels">
          <span>← Ouder</span>
          <span>Tijdlijn (${cards.length} / 10 kaarten)</span>

      </div>`;

  function renderPhoneStatus(player, showHostGear = false) {
    return `

        </div>
      </div>`;
  }

  function renderPhoneVTimeline(cards, mode, opts = {}) {
    // mode: 'view' | 'place' | 'steal'
    const { selectedIdx = -1, lockedIdx = -1, lockedName = "Bram", stealIdx = -1 } = opts;
    let html = `<div class="ph-vtimeline">`;
    for (let i = 0; i <= cards.length; i++) {
      const rangeLbl = i === 0
        ? `Vóór ${cards[0].year}`
        : i === cards.length
          ? `Ná ${cards[cards.length - 1].year}`
          : `Tussen ${cards[i - 1].year} en ${cards[i].year}`;

      if (mode === "place") {
        const isSel = i === selectedIdx;
        html += `
          <button class="ph-slot-btn ${isSel ? "selected" : ""}" data-place-slot="${i}">
            ${isSel ? `<span>?</span> <span>Jouw keuze · ${rangeLbl}</span>` : `<span>+</span> <span>${rangeLbl}</span>`}
          </button>`;
      } else if (mode === "steal") {
        if (i === lockedIdx) {
          html += `<div class="ph-slot-btn locked-other">🔒 ${lockedName}'s keuze (${rangeLbl})</div>`;
        } else {
          const isSt = i === stealIdx;
          html += `
            <button class="ph-slot-btn ${isSt ? "steal-selected" : ""}" data-steal-slot="${i}">
              ${isSt ? `<span>⚡</span> <span>Jouw STEAL · ${rangeLbl}</span>` : `<span>+</span> <span>Steal: ${rangeLbl}</span>`}
            </button>`;
        }
      }

      if (i < cards.length) {
        const c = cards[i];
        const d = decadeInfo(c.year);
        html += `
          <div class="ph-tcard" style="border-left-color:${d.color}">
            <div class="yr num">${c.year}</div>
            <div class="meta">
              <div class="art">${c.artist}</div>
              <div class="ttl">${c.title}</div>
            </div>
          </div>`;
      }
    }
    html += `</div>`;
    return html;
  }

  function bindInteractiveHandlers() {
    document.querySelectorAll("[data-place-slot]").forEach(btn => {
      btn.addEventListener("click", () => {
        bramSelectedSlot = Number(btn.getAttribute("data-place-slot"));
        renderState("plaatsen");
      });
    });
    document.querySelectorAll("[data-steal-slot]").forEach(btn => {
      btn.addEventListener("click", () => {
        lisaStealSlot = Number(btn.getAttribute("data-steal-slot"));
        renderState("steal");
      });
    });
    const bonusBtn = document.getElementById("bonusToggleBtn");
    if (bonusBtn) {
      bonusBtn.addEventListener("click", () => {
        bramClaimedBonus = !bramClaimedBonus;
        renderState(currentState);
      });
    }
    const confirmPlace = document.getElementById("confirmPlaceBtn");
    if (confirmPlace) {
      confirmPlace.addEventListener("click", () => renderState("steal"));
    }
    const confirmSteal = document.getElementById("confirmStealBtn");
    if (confirmSteal) {
      confirmSteal.addEventListener("click", () => renderState("onthulling"));
    }
    const approveBonus = document.getElementById("approveBonusBtn");
    if (approveBonus) {
      approveBonus.addEventListener("click", () => renderState("resultaat"));
    }
    const replayFlip = document.getElementById("replayFlipBtn");
    if (replayFlip) {
      replayFlip.addEventListener("click", () => {
        const fc = document.getElementById("flipCardEl");
        if (!fc) return;
        fc.classList.remove("flipped");
        setTimeout(() => fc.classList.add("flipped"), 120);
      });
    }
    const slider = document.getElementById("guessSlider");
    if (slider) {
      slider.addEventListener("input", () => {
        silentGuessYear = Number(slider.value);
        const lbl = document.getElementById("guessValLbl");
        if (lbl) lbl.textContent = silentGuessYear;
      });
    }
  }

  // ==================== NAVIGATION & RESPONSIVE SCALING ====================
  function buildNav() {
    const nav = document.getElementById("stateNav");
    nav.innerHTML = STATES.map(s => `
      <button class="state-btn" data-state="${s.id}">
        <span class="step-num">${s.num}</span>${s.label}
      </button>`).join("");
    nav.querySelectorAll(".state-btn").forEach(btn => {
      btn.addEventListener("click", () => renderState(btn.getAttribute("data-state")));
    });

    document.querySelectorAll(".view-btn").forEach(btn => {
      btn.addEventListener("click", () => setViewMode(btn.getAttribute("data-view"), false));
    });
    document.getElementById("exitFsBtn").addEventListener("click", () => setViewMode("both", false));
  }

  function updateActiveNav() {
    document.querySelectorAll(".state-btn").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-state") === currentState);
    });
    document.querySelectorAll(".view-btn").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-view") === currentView);
    });
  }

  function setViewMode(mode, hideChrome = false) {
    currentView = mode;
    document.body.classList.remove("mode-tv", "mode-phone", "chrome-hidden", "show-exit-fs");
    if (mode === "tv") document.body.classList.add("mode-tv");
    if (mode === "phone") document.body.classList.add("mode-phone");
    if (hideChrome) document.body.classList.add("chrome-hidden");
    updateActiveNav();
    layoutSizes();
  }

  function layoutSizes() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const isChromeHidden = document.body.classList.contains("chrome-hidden");
    const root = document.documentElement;

    if (currentView === "tv") {
      const padW = isChromeHidden ? 0 : 60;
      const padH = isChromeHidden ? 0 : 190;
      const availW = Math.max(320, vw - padW);
      const availH = Math.max(200, vh - padH);
      const scale = Math.min(availW / 1920, availH / 1080, 1);
      root.style.setProperty("--tv-scale", scale.toFixed(6));
      root.style.setProperty("--tv-w", `${Math.round(1920 * scale)}px`);
      root.style.setProperty("--tv-h", `${Math.round(1080 * scale)}px`);
    } else if (currentView === "phone") {
      const padW = isChromeHidden ? 0 : 48;
      const padH = isChromeHidden ? 0 : 190;
      const availW = Math.max(240, vw - padW);
      const availH = Math.max(400, vh - padH);
      const scale = Math.min(availW / 390, availH / 844, 1);
      root.style.setProperty("--ph-scale", scale.toFixed(6));
      root.style.setProperty("--ph-w", `${Math.round(390 * scale)}px`);
      root.style.setProperty("--ph-h", `${Math.round(844 * scale)}px`);
    } else {
      // Side by side: fit TV (16:9) + Phone (9:19.5) cleanly in ONE row on desktop
      const chromeH = 195;
      const availH = Math.max(360, vh - chromeH);
      const phScale = Math.min(0.82, Math.max(0.56, (availH - 44) / 844));
      const phW = Math.round(390 * phScale);
      const phH = Math.round(844 * phScale);

      // Account for bezels (tv 24px + phone 30px), stage padding (48px), gap (24px) = 126px
      const availTvW = Math.max(480, vw - phW - 140);
      const availTvH = Math.max(300, availH - 44);
      const tvScale = Math.min(availTvW / 1920, availTvH / 1080, 0.72);
      const tvW = Math.round(1920 * tvScale);
      const tvH = Math.round(1080 * tvScale);

      root.style.setProperty("--tv-scale", tvScale.toFixed(6));
      root.style.setProperty("--tv-w", `${tvW}px`);
      root.style.setProperty("--tv-h", `${tvH}px`);
      root.style.setProperty("--ph-scale", phScale.toFixed(6));
      root.style.setProperty("--ph-w", `${phW}px`);
      root.style.setProperty("--ph-h", `${phH}px`);
    }
  }

  // ==================== INIT (SUPPORT URL PARAMS FOR DIRECT TV/PHONE PREVIEW) ====================
  buildNav();
  const params = new URLSearchParams(window.location.search);
  const initState = params.get("state") || "plaatsen";
  const initView = params.get("view") || (window.innerWidth <= 480 ? "phone" : "both");
  const capture = params.get("capture") === "1";

  setViewMode(initView, capture);
  renderState(initState);
  window.addEventListener("resize", layoutSizes);
})();
</script>
